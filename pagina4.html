<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Laboratorio de Computación</title>

<style>
/* =========================
   CONFIGURACIÓN GENERAL
   ========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; /* Quita el sombreado azul en móviles */
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden; /* Evita scroll horizontal */
}

body {
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #e0e0e0;
  text-align: center;
}

/* =========================
   MARCO DEL LABORATORIO
   ========================= */
.marco {
  display: inline-block;
  background: #ffffff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
  overflow: visible;
  max-width: 100%;
}

/* =========================
   PIZARRA
   ========================= */
.pizarra {
  margin: 0 auto 30px auto;
  width: 500px;
  max-width: 100%;
  height: 120px;
  background: #2d572c;
  border: 8px solid #8b5a2b;
  border-radius: 8px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
}

/* =========================
   CUADRÍCULA DEL LABORATORIO
   ========================= */
.lab {
  display: grid;
  grid-template-columns: repeat(3, 120px) 80px repeat(2, 120px);
  gap: 20px;
  justify-content: center;
}

/* =========================
   PC
   ========================= */
.pc {
  width: 120px;
  height: 90px;
  position: relative;
  cursor: pointer;
  outline: none;
}

.pc img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Elimina borde azul al hacer clic */
.pc:focus,
.pc:active,
.pc:focus-visible {
  outline: none !important;
  box-shadow: none !important;
}

/* =========================
   TOOLTIP
   ========================= */
.pc::after {
  content: attr(data-info);
  position: absolute;
  bottom: 110%;
  left: 50%;
  transform: translateX(-50%);
  background: #000;
  color: #fff;
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: pre-line;
  text-align: left;
  z-index: 999;
  pointer-events: none;
}

.pc:hover::after,
.pc:active::after {
  opacity: 1;
}

/* =========================
   RESPONSIVO PARA MÓVILES
   ========================= */
@media (max-width: 768px) {
  body {
    padding: 8px;
    overflow-x: hidden;
  }

  .marco {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 10px;
    margin: 0 auto;
  }

  .pizarra {
    width: 100%;
    height: 70px;
    font-size: 16px;
    margin-bottom: 15px;
    border-width: 5px;
  }

  .lab {
    width: 100%;
    justify-content: center;
    grid-template-columns:
      repeat(3, minmax(0, 1fr))
      4vw
      repeat(2, minmax(0, 1fr));
    gap: 2vw;
  }

  .pc {
    width: 100%;
    aspect-ratio: 4 / 3;
    height: auto;
    min-width: 0;
  }

  .pc::after {
    font-size: 9px;
    max-width: 110px;
    padding: 5px;
  }

  h2 {
    font-size: 18px;
    margin: 10px 0;
  }
}

@media (max-width: 480px) {
  body {
    padding: 6px;
  }

  .marco {
    padding: 8px;
  }

  .pizarra {
    height: 60px;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .lab {
    grid-template-columns:
      repeat(3, minmax(0, 1fr))
      3vw
      repeat(2, minmax(0, 1fr));
    gap: 1.5vw;
  }

  .pc::after {
    font-size: 8px;
    max-width: 90px;
  }

  h2 {
    font-size: 16px;
  }
}
</style>
</head>
