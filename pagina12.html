<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Línea de Tiempo de Directores</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Georgia', serif;
    }

    body {
        background: linear-gradient(135deg, #000000, #111111, #1a1a1a);
        color: white;
        overflow-x: hidden;
    }

    h1 {
        text-align: center;
        padding: 40px 20px 20px;
        font-size: 3rem;
        color: #ffd700;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .subtitle {
        text-align: center;
        color: #ccc;
        margin-bottom: 60px;
        font-size: 1.2rem;
    }

    .timeline {
        position: relative;
        width: 90%;
        max-width: 1400px;
        margin: auto;
        padding-bottom: 80px;
    }

    /* Línea central */
    .timeline::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 6px;
        height: 100%;
        background: linear-gradient(to bottom, #ffd700, #b8860b);
        transform: translateX(-50%);
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .event {
        position: relative;
        width: 50%;
        padding: 30px 40px;
        opacity: 0;
        transform: translateY(50px);
        transition: all 1s ease;
    }

    .event.show {
        opacity: 1;
        transform: translateY(0);
    }

    .event.left {
        left: 0;
        text-align: right;
    }

    .event.right {
        left: 50%;
        text-align: left;
    }

    /* Punto en la línea */
    .event::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 24px;
        height: 24px;
        background: radial-gradient(circle, #ffd700, #b8860b);
        border: 4px solid #fff8dc;
        border-radius: 50%;
        transform: translateY(-50%);
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        z-index: 10;
    }

    .event.left::after {
        right: -12px;
    }

    .event.right::after {
        left: -12px;
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 215, 0, 0.3);
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
        transform: scale(1.03);
        box-shadow: 0 20px 40px rgba(255,215,0,0.2);
    }

    .card img {
        width: 100%;
        max-width: 420px;
        border-radius: 15px;
        cursor: pointer;
        transition: transform 0.4s ease;
    }

    .card img:hover {
        transform: scale(1.02);
    }

    .year {
        margin-top: 15px;
        font-size: 1.8rem;
        color: #ffd700;
        font-weight: bold;
    }

    .name {
        margin-top: 8px;
        font-size: 1.3rem;
        color: #ffffff;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 999;
        inset: 0;
        background: rgba(0,0,0,0.95);
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal img {
        max-width: 95%;
        max-height: 95%;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(255,215,0,0.4);
    }

    .close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 3rem;
        color: #ffd700;
        cursor: pointer;
        font-weight: bold;
    }

    footer {
        text-align: center;
        padding: 30px;
        color: #aaa;
        font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .timeline::before {
            left: 30px;
        }

        .event {
            width: 100%;
            padding-left: 80px;
            padding-right: 20px;
            left: 0 !important;
            text-align: left !important;
        }

        .event::after {
            left: 18px !important;
            right: auto !important;
        }

        h1 {
            font-size: 2.2rem;
        }

        .year {
            font-size: 1.5rem;
        }

        .name {
            font-size: 1.1rem;
        }
    }
</style>
</head>
<body>

<h1>📜 Línea de Tiempo de Directores</h1>
<p class="subtitle">Historia de autoridades institucionales</p>

<div class="timeline">

    <!-- 2010-2013 -->
    <div class="event left">
        <div class="card">
            <img src="images/6.png" alt="Mgtr. Lida Orellana">
            <div class="year">2010 - 2013</div>
            <div class="name">Mgtr. Lida Orellana</div>
        </div>
    </div>

    <!-- 2014-2016 -->
    <div class="event right">
        <div class="card">
            <img src="images/7.png" alt="Mgtr. Edwin Jiménez">
            <div class="year">2014 - 2016</div>
            <div class="name">Mgtr. Edwin Jiménez</div>
        </div>
    </div>

    <!-- 2015-2020 -->
    <div class="event left">
        <div class="card">
            <img src="images/8.png" alt="Mgtr. Alejandra Perez">
            <div class="year">2015 - 2020</div>
            <div class="name">Mgtr. Alejandra Perez</div>
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
    <span class="close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
</div>

<footer>
    Institución Educativa © 2026
</footer>

<script>
    // Animación al hacer scroll
    const events = document.querySelectorAll('.event');

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, {
        threshold: 0.2
    });

    events.forEach(event => observer.observe(event));

    // Modal de imagen
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const closeBtn = document.querySelector('.close');

    document.querySelectorAll('.card img').forEach(img => {
        img.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImg.src = img.src;
        });
    });

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    modal.addEventListener('click', e => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });
</script>

</body>
</html>
